listeners.tcp.default = 5672
management.tcp.port = 15672

# O usuário guest só pode conectar via localhost; o acesso remoto usa o usuário definido no ambiente
loopback_users.guest = true

# Mensagens de triagem são pequenas; evita que o container de 1.5 GB pare de aceitar publicações
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB
