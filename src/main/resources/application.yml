spring:
  application:
    name: antes-da-chuva

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${AI_MODEL:gemini-2.5-flash}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:https://antes-da-chuva.example}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

app:
  rabbitmq:
    exchange: incident.exchange
    queue: incident.triage.queue
    routing-key: incident.created